<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job board</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 640px; padding: 16px; }
      li { border: 1px solid #ddd; border-radius: 8px; list-style: none; margin: 8px 0; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
      ul { padding: 0; }
      input { font-size: 16px; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
      button { cursor: pointer; }
      .empty { font-style: italic; color: #666; }
      .remove-btn { background: none; border: none; color: #dc3545; font-size: 24px; font-weight: bold; padding: 0 8px; line-height: 1; }
      .remove-btn:hover { color: #a71e2a; }
      .save-btn { background: #007bff; color: white; border: none; border-radius: 4px; padding: 6px 16px; font-size: 14px; }
      .save-btn:hover { background: #0056b3; }
      .job-text { flex: 1; margin-right: 12px; }
    </style>
  </head>
  <body>
    <h1>Saved Jobs</h1>
    <ul id="saved"></ul>

    <h2>All Jobs</h2>
    <input id="search" placeholder="Search by title, company or place" />
    <ul id="jobs"></ul>
    <script type="module" src="/app.js"></script>
  </body>
</html>
